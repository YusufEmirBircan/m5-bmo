name: Build ESP32S3 M5Gemini BMO Firmware

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        run: |
          idf.py set-target esp32s3
          idf.py build

      - name: Merge Binaries
        working-directory: build
        run: |
          esptool.py --chip esp32s3 merge_bin -o M5Gemini_BMO_full.bin @flash_args

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: M5Gemini_BMO_Firmware
          path: |
            build/M5Gemini_BMO_full.bin
            build/M5Gemini.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
